[package]
name = "jungle-wasm"
description = "Browser bridge: the Jungle engine behind the web UI's JSON protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
jungle-core = { path = "../jungle-core" }
jungle-eval = { path = "../jungle-eval" }
jungle-search = { path = "../jungle-search" }

# wasm-bindgen compiles on native too, where its attributes are inert. Keeping it
# unconditional is what lets `cargo test -p jungle-wasm` exercise the whole bridge
# on the host, rather than only in a browser.
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

# Test-only. A real JSON reader makes the protocol assertions readable, and a
# dev-dependency cannot reach the shipped payload.
[dev-dependencies]
serde_json = "1"

# `cdylib` is the .wasm module; `rlib` is what the test harness links against.
[lib]
name = "jungle_wasm"
crate-type = ["cdylib", "rlib"]
