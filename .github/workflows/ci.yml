name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python engine + bridge tests
        run: |
          pip install pytest
          python -m pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JS unit tests
        run: npm run test:js
      - name: Pyodide smoke test
        run: |
          npm ci
          npm run test:pyodide
